# Plymouth draws the disk password prompt and the boot splash, as on x86
# NixOS. It goes right after systemd so its initrd units order correctly,
# only when the hook is installed, and never twice.
if [[ -f /usr/lib/initcpio/install/plymouth && " ${HOOKS[*]} " != *" plymouth "* ]]; then
  _nixos_mac_plymouth_hooks=()
  _nixos_mac_plymouth_added=false
  for _nixos_mac_plymouth_hook in "${HOOKS[@]}"; do
    _nixos_mac_plymouth_hooks+=("$_nixos_mac_plymouth_hook")
    if [[ $_nixos_mac_plymouth_hook == systemd && $_nixos_mac_plymouth_added == false ]]; then
      _nixos_mac_plymouth_hooks+=(plymouth)
      _nixos_mac_plymouth_added=true
    fi
  done
  if [[ $_nixos_mac_plymouth_added == true ]]; then
    HOOKS=("${_nixos_mac_plymouth_hooks[@]}")
  fi
  unset _nixos_mac_plymouth_hooks _nixos_mac_plymouth_added _nixos_mac_plymouth_hook
fi
