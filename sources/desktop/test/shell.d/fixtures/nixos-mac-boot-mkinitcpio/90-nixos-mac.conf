_nixos_asahi_hooks=()
_nixos_asahi_added=false
for _nixos_asahi_hook in "${HOOKS[@]}"; do
  if [[ $_nixos_asahi_hook == asahi ]]; then
    _nixos_asahi_added=true
  fi
  if [[ $_nixos_asahi_hook == filesystems && $_nixos_asahi_added == false ]]; then
    _nixos_asahi_hooks+=(asahi nixos-vendorfw)
