  fi
  _nixos_asahi_hooks+=("$_nixos_asahi_hook")
done
if [[ $_nixos_asahi_added == false ]]; then
  _nixos_asahi_hooks+=(asahi nixos-vendorfw)
fi
HOOKS=("${_nixos_asahi_hooks[@]}")
unset _nixos_asahi_hooks _nixos_asahi_hook _nixos_asahi_added
