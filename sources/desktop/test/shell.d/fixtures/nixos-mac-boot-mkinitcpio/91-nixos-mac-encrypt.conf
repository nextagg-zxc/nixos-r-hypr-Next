# Insert nixos-mac-encrypt after vendorfw/block and sd-encrypt immediately
# before filesystems, each only if that hook is absent. 90-nixos-mac.conf
# already put asahi and nixos-vendorfw before filesystems; this drop-in is
# sourced after it.
#
# Both are systemd initrd units: the systemd hook replaces udev (mkinitcpio's
# stock HOOKS line) and keymap/consolefont become sd-vconsole. A HOOKS line
# carrying the busybox encrypt hook belongs to a Mac unlocked by cryptdevice=,
# which sd-encrypt cannot parse: that line is left exactly as it is.
_nixos_mac_encrypt_hooks=()
_nixos_mac_encrypt_have_systemd=false
_nixos_mac_encrypt_have_vconsole=false
_nixos_mac_encrypt_have_encrypt=false
for _nixos_mac_encrypt_hook in "${HOOKS[@]}"; do
  case $_nixos_mac_encrypt_hook in
    systemd) _nixos_mac_encrypt_have_systemd=true ;;
    sd-vconsole) _nixos_mac_encrypt_have_vconsole=true ;;
    encrypt) _nixos_mac_encrypt_have_encrypt=true ;;
  esac
done
if [[ $_nixos_mac_encrypt_have_encrypt == false ]]; then
for _nixos_mac_encrypt_hook in "${HOOKS[@]}"; do
  case $_nixos_mac_encrypt_hook in
    udev)
      if [[ $_nixos_mac_encrypt_have_systemd == false ]]; then
        _nixos_mac_encrypt_hooks+=(systemd)
        _nixos_mac_encrypt_have_systemd=true
      fi
      ;;
    keymap|consolefont)
      if [[ $_nixos_mac_encrypt_have_vconsole == false ]]; then
        _nixos_mac_encrypt_hooks+=(sd-vconsole)
        _nixos_mac_encrypt_have_vconsole=true
      fi
      ;;
    *) _nixos_mac_encrypt_hooks+=("$_nixos_mac_encrypt_hook") ;;
  esac
done
if [[ $_nixos_mac_encrypt_have_systemd == false ]]; then
  if [[ ${_nixos_mac_encrypt_hooks[0]:-} == base ]]; then
    _nixos_mac_encrypt_hooks=(base systemd "${_nixos_mac_encrypt_hooks[@]:1}")
  else
    _nixos_mac_encrypt_hooks=(systemd "${_nixos_mac_encrypt_hooks[@]}")
  fi
fi
HOOKS=("${_nixos_mac_encrypt_hooks[@]}")
_nixos_mac_encrypt_hooks=()
_nixos_mac_encrypt_have_ours=false
_nixos_mac_encrypt_have_sd=false
_nixos_mac_encrypt_added_ours=false
_nixos_mac_encrypt_added_sd=false
for _nixos_mac_encrypt_hook in "${HOOKS[@]}"; do
  if [[ $_nixos_mac_encrypt_hook == nixos-mac-encrypt ]]; then
    _nixos_mac_encrypt_have_ours=true
  fi
  if [[ $_nixos_mac_encrypt_hook == sd-encrypt ]]; then
    _nixos_mac_encrypt_have_sd=true
  fi
done
for _nixos_mac_encrypt_hook in "${HOOKS[@]}"; do
  if [[ $_nixos_mac_encrypt_hook == sd-encrypt && $_nixos_mac_encrypt_have_ours == false &&
        $_nixos_mac_encrypt_added_ours == false ]]; then
    _nixos_mac_encrypt_hooks+=(nixos-mac-encrypt)
    _nixos_mac_encrypt_added_ours=true
  fi
  if [[ $_nixos_mac_encrypt_hook == filesystems ]]; then
    if [[ $_nixos_mac_encrypt_have_ours == false && $_nixos_mac_encrypt_added_ours == false ]]; then
      _nixos_mac_encrypt_hooks+=(nixos-mac-encrypt)
      _nixos_mac_encrypt_added_ours=true
    fi
    if [[ $_nixos_mac_encrypt_have_sd == false && $_nixos_mac_encrypt_added_sd == false ]]; then
      _nixos_mac_encrypt_hooks+=(sd-encrypt)
      _nixos_mac_encrypt_added_sd=true
    fi
  fi
  _nixos_mac_encrypt_hooks+=("$_nixos_mac_encrypt_hook")
done
if [[ $_nixos_mac_encrypt_have_ours == false && $_nixos_mac_encrypt_added_ours == false ]]; then
  _nixos_mac_encrypt_hooks+=(nixos-mac-encrypt)
fi
if [[ $_nixos_mac_encrypt_have_sd == false && $_nixos_mac_encrypt_added_sd == false ]]; then
  _nixos_mac_encrypt_hooks+=(sd-encrypt)
fi
HOOKS=("${_nixos_mac_encrypt_hooks[@]}")
fi
unset _nixos_mac_encrypt_hooks _nixos_mac_encrypt_hook \
  _nixos_mac_encrypt_have_ours _nixos_mac_encrypt_have_sd \
  _nixos_mac_encrypt_added_ours _nixos_mac_encrypt_added_sd \
  _nixos_mac_encrypt_have_systemd _nixos_mac_encrypt_have_vconsole \
  _nixos_mac_encrypt_have_encrypt
