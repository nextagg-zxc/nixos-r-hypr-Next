    - id: mitigationsOff
      name: "Без защиты CPU"
      description: "Отключает защиту от уязвимостей процессора (Spectre/Meltdown). В играх может прибавить несколько процентов, но вредоносный код сможет читать чужую память. Включайте, только если понимаете риск."
