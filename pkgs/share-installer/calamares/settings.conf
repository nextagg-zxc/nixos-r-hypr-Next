# Установщик раздаваемой NixOS: штатные страницы Calamares + свои страницы выбора (packagechooser)
# и свой шаг установки (nixos-share: флейк в /etc/nixos, choices.json, nixos-install без интернета).
---
modules-search: [ local, @ext@/lib/calamares/modules, @upstream@/lib/calamares/modules ]

instances:
- { id: desktop,     module: packagechooser, config: packagechooser-desktop.conf }
- { id: kdelook,     module: packagechooser, config: packagechooser-kdelook.conf }
- { id: kernel,      module: packagechooser, config: packagechooser-kernel.conf }
- { id: kernelbuild, module: packagechooser, config: packagechooser-kernelbuild.conf }
- { id: gpu,         module: packagechooser, config: packagechooser-gpu.conf }
- { id: player,      module: packagechooser, config: packagechooser-player.conf }
- { id: extras,      module: packagechooser, config: packagechooser-extras.conf }
- { id: system,      module: packagechooser, config: packagechooser-system.conf }
- { id: security,    module: packagechooser, config: packagechooser-security.conf }

sequence:
- show:
  - welcome
  - locale
  - keyboard
  - users
  - packagechooser@desktop
  - packagechooser@kdelook
  - packagechooser@kernel
  - packagechooser@kernelbuild
  - packagechooser@gpu
  - packagechooser@player
  - packagechooser@extras
  - packagechooser@system
  - packagechooser@security
  - partition
  - summary
- exec:
  - partition
  - mount
  - nixos-share
  - users
  - umount
- show:
  - finished

branding: nixos
prompt-install: true
dont-chroot: false
oem-setup: false
disable-cancel: false
disable-cancel-during-exec: false
hide-back-and-next-during-exec: true
quit-at-end: false
